# Publishes the visualization to GitHub Pages on every push to main.
# The page is one self-contained file: it is served both at the site root
# (index.html) and at its own name, so old links keep working.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage site
        run: |
          mkdir _site
          cp quebec-arrivals.html _site/index.html
          cp quebec-arrivals.html _site/quebec-arrivals.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
